version: '3.8'

services:
  freepbx:
    image: tirans/freepbx:17
    container_name: freepbx-beautiful-ui
    restart: always
    environment:
      - ENABLE_FAIL2BAN=true
      - ADMIN_LANGUAGE=zh_TW       # 預設直接啟用繁體中文介面
    volumes:
      - freepbx_certs:/etc/asterisk/keys
      - freepbx_data:/var/lib/asterisk
      - freepbx_www:/var/www/html
    ports:
      - "80:80/tcp"                # 後台管理 Web 介面 (由 Zeabur 綁定漂亮網域與 HTTPS)
      - "5060:5060/udp"            # SIP 註冊埠
      - "10000-10020:10000-10020/udp" # RTP 語音通道範圍 (限制數量，方便 Zeabur 對外對應)

volumes:
  freepbx_certs:
  freepbx_data:
  freepbx_www:
